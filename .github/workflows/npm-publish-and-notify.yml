name: step 1 and notify to above

on:
  workflow_dispatch:

jobs:
  publish-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        id: publish_step
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          if npm view json-crud-ui-init@$CURRENT_VERSION version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publication."
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            npm publish
            echo "status=published" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update Action Summary
        run: |
          echo "### Publication Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_step.outputs.status }}" = "published" ]; then
            echo "Successfully published version: **${{ steps.publish_step.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "Version **${{ steps.publish_step.outputs.version }}** is already published on npm. Skipping publication." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: keshavsoft/vs-code-ext-from-any-js
          event-type: kschema_published

      - name: Update Notification Summary
        run: |
          echo "### Notification Status" >> $GITHUB_STEP_SUMMARY
          echo "Notified repository: **keshavsoft/vs-code-ext-from-any-js**" >> $GITHUB_STEP_SUMMARY
